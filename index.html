<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tên Của Bạn | Bio Link</title>
    <!-- Thư viện Icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 16px;
            transition: transform 0.3s ease;
        }
        .avatar:hover { transform: scale(1.05); }
        h1 { font-size: 1.6rem; margin-bottom: 6px; }
        .bio { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
        .links { display: flex; flex-direction: column; gap: 14px; }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.25s ease;
        }
        .link-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Thay link ảnh đại diện của bạn vào src -->
        <img src="https://avatars.githubusercontent.com/u/9919?s=200&v=4" alt="Avatar" class="avatar">
        <h1>Tên Của Bạn</h1>
        <p class="bio">Developer • Designer • Content Creator</p>
        
        <div class="links">
            <a href="https://facebook.com" target="_blank" class="link-btn"><i class="fab fa-facebook"></i> Facebook</a>
            <a href="https://github.com" target="_blank" class="link-btn"><i class="fab fa-github"></i> GitHub</a>
            <a href="https://tiktok.com" target="_blank" class="link-btn"><i class="fab fa-tiktok"></i> TikTok</a>
            <a href="mailto:email@gmail.com" class="link-btn"><i class="fas fa-envelope"></i> Liên hệ Email</a>
        </div>
    </div>
</body>
</html>
